<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Recuperar Contraseña</title>
   <link rel="shortcut icon" href="../assets/img/logo.png" />
   <link rel="stylesheet" href="../css/estilos-recuperar-password.css">
   <link rel="stylesheet" href="../css/temas-colores-fuentes.css">
   <link rel="stylesheet" href="../css/estilos-principal.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
   <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite" />
</head>

<body>

   <header id="encabezado-principal">
      <section class="logo">
         <a href="../index.html">
            <img src="../assets/img/logo.png" alt="logo">
         </a>
      </section>
      <section class="icons">
         <a href="#"><i class="fa-solid fa-moon"></i></a>
      </section>
   </header>

   <main>
      <form id="formulario-recuperar" action="login.html">
         <div class="main-recuperar">
            <h1>Olvidaste tu contraseña?</h1>
            <span>Ingresá el email con el que te registraste y te enviaremos los pasos a seguir para generar una nueva
               contraseña</span>
            <label for="email"></label>
            <input type="email" id="email" placeholder="Email*" required>
            <span class="check">
               <label class="check-label" for="check">
                  <input type="checkbox" id="check" required>
                  <span class="check-text">
                     Al continuar, confirmo que he leído y aceptado los Términos y condiciones y las políticas de
                     privacidad
                  </span>
               </label>
            </span>
            <button class="submit" type="submit" disabled>CONTINUAR</button>
         </div>

      </form>
   </main>

   <footer>
      <div class="footer-container">
         <section class="Menu">
            <h3>MENÚ</h3>
            <ul class="menu-list">
               <li><a href="../index.html">Home</a></li>
               <li><a href="datos-personales.html">Perfil</a></li>
            </ul>
         </section>

         <section class="redes-sociales">
            <h3>¡SÍGUENOS!</h3>
            <div class="icons">
               <a href="#"><i class="fa-brands fa-instagram fa-lg"></i></a>
               <a href="#"><i class="fa-brands fa-youtube fa-lg"></i></a>
               <a href="#"><i class="fa-brands fa-x-twitter fa-lg"></i></a>
            </div>
         </section>

         <section class="legal">
            <h3>LEGAL</h3>
            <ul class="legal-list">
               <li><a href="#">Privacy</a></li>
               <li><a href="#">Cookies</a></li>
               <li><a href="#">Legal</a></li>
            </ul>
         </section>

      </div>
   </footer>

   <script src="../js/temas.js"></script>
   <script src="../js/formularios.js"></script>
</body>

</html>
